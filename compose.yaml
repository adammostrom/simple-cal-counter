services: 
    postgres:
        image: docker.io/library/postgres:16
        environment: 
            POSTGRES_DB: openfood
            POSTGRES_USER: simpcalo
            POSTGRES_PASSWORD: simcal
        volumes:
            - postgres_data:/var/lib/postgresql/data
    app:
        image: localhost/nutritionapp:1.0
        ports: 
            - 8080:8080
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: openfood
            DB_USER: simpcalo
            DB_PASSWORD: simcal


volumes:
    postgres_data:
